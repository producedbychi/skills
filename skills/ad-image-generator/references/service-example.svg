<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Service ad composition example</title>
  <desc id="desc">Wireframe for a video-production service ad, with a real work still placeholder, one headline, brand, and three annotations.</desc>
  <rect width="1200" height="680" fill="#F4F2EC"/>
  <text x="40" y="28" fill="#36514F" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ILLUSTRATIVE WIREFRAME</text>
  <rect x="40" y="44" width="484" height="592" rx="10" fill="#102A2A"/>
  <text x="74" y="92" fill="#F4F2EC" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">NORTHLINE STUDIO</text>
  <text x="74" y="147" fill="#F4F2EC" font-family="Georgia, serif" font-size="49" font-weight="700">Let them see</text>
  <text x="74" y="204" fill="#F4F2EC" font-family="Georgia, serif" font-size="49" font-weight="700">the work.</text>
  <rect x="74" y="233" width="416" height="261" rx="4" fill="#B8C6BD"/>
  <path d="M74 494 L234 325 L326 410 L401 281 L490 358 L490 494 Z" fill="#76948B"/>
  <rect x="109" y="328" width="343" height="72" rx="5" fill="#102A2A" fill-opacity="0.86"/>
  <text x="139" y="358" fill="#F4F2EC" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">APPROVED WORK STILL</text>
  <text x="139" y="383" fill="#D7E0D8" font-family="Arial, sans-serif" font-size="14">Never fabricate client footage</text>
  <text x="74" y="535" fill="#F4F2EC" font-family="Arial, sans-serif" font-size="21">Video production for nonprofits</text>
  <line x1="74" y1="561" x2="490" y2="561" stroke="#6F9290" stroke-width="1"/>
  <text x="74" y="597" fill="#E9A16F" font-family="Arial, sans-serif" font-size="17" font-weight="700">Plan your next film</text>
  <circle cx="491" cy="181" r="18" fill="#E9A16F"/><text x="485" y="188" fill="#102A2A" font-family="Arial, sans-serif" font-size="18" font-weight="700">1</text>
  <circle cx="491" cy="382" r="18" fill="#E9A16F"/><text x="485" y="389" fill="#102A2A" font-family="Arial, sans-serif" font-size="18" font-weight="700">2</text>
  <circle cx="491" cy="579" r="18" fill="#E9A16F"/><text x="485" y="586" fill="#102A2A" font-family="Arial, sans-serif" font-size="18" font-weight="700">3</text>
  <text x="582" y="94" fill="#102A2A" font-family="Arial, sans-serif" font-size="29" font-weight="700">Service work route</text>
  <text x="582" y="126" fill="#52615E" font-family="Arial, sans-serif" font-size="17">A work sample carries the idea, not stock equipment.</text>
  <line x1="524" y1="181" x2="563" y2="181" stroke="#D87F50" stroke-width="2"/>
  <text x="582" y="177" fill="#102A2A" font-family="Arial, sans-serif" font-size="20" font-weight="700">One audience-specific message</text>
  <text x="582" y="205" fill="#52615E" font-family="Arial, sans-serif" font-size="17">Read the headline before the supporting detail.</text>
  <line x1="524" y1="382" x2="563" y2="382" stroke="#D87F50" stroke-width="2"/>
  <text x="582" y="376" fill="#102A2A" font-family="Arial, sans-serif" font-size="20" font-weight="700">Actual deliverable as the focal point</text>
  <text x="582" y="404" fill="#52615E" font-family="Arial, sans-serif" font-size="17">Replace the box with licensed, approved work.</text>
  <text x="582" y="430" fill="#52615E" font-family="Arial, sans-serif" font-size="17">If none exists, choose an illustrative route.</text>
  <line x1="524" y1="579" x2="563" y2="579" stroke="#D87F50" stroke-width="2"/>
  <text x="582" y="573" fill="#102A2A" font-family="Arial, sans-serif" font-size="20" font-weight="700">Brand and action remain legible</text>
  <text x="582" y="601" fill="#52615E" font-family="Arial, sans-serif" font-size="17">Use native CTA fields when the platform supplies them.</text>
  <text x="582" y="633" fill="#8B6352" font-family="Arial, sans-serif" font-size="15">Do not copy this layout without matching the offer and brand.</text>
</svg>
